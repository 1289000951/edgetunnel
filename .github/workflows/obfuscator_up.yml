name: 混淆最新版本源码
on:
    workflow_dispatch:

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 使用 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 javascript-obfuscator
        run: npm install -g javascript-obfuscator

      - name: 下载远程最新 _worker.js 源码
        run: |
          set -e
          curl --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 \
            -o source_raw.js https://raw.githubusercontent.com/cmliu/edgetunnel/main/_worker.js
          echo "源码下载完成"

      - name: 备份本次原版源码
        run: |
          cp source_raw.js _worker.js.backup

      - name: JS代码混淆
        run: |
          javascript-obfuscator source_raw.js --output _worker.js \
          --compact true \
          --control-flow-flattening true \
          --control-flow-flattening-threshold 1 \
          --dead-code-injection true \
          --dead-code-injection-threshold 0.4 \
          --identifier-names-generator hexadecimal \
          --rename-globals true \
          --string-array true \
          --string-array-encoding 'rc4' \
          --string-array-threshold 1 \
          --transform-object-keys true \
          --unicode-escape-sequence true

      - name: 提交混淆后文件
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin ${{ github.ref_name }}
          git add _worker.js _worker.js.backup
          if git diff --cached --quiet; then
            echo "文件无变化，跳过提交"
          else
            git commit -m "自动混淆更新 _worker.js | 同步上游源码"
          fi

      - name: 推送代码
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
